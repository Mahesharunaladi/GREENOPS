<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOps Scrapper | Sustainable Cloud Automation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    :root {
--primary: #2ecc71; /* Green */
--secondary: #09b4d6; /* Blue/Cyan */
--dark-bg: #0a0f1c;
--text-main: #ffffff;
--glass: rgba(15, 23, 42, 0.7);
}

          * { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: 'Inter', sans-serif;
background-color: var(--dark-bg);
color: var(--text-main);
overflow-x: hidden;
}


nav {
    position: fixed;
top: 0;
width: 100%;
padding: 2rem 5%;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 100;
}

.logo { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.5rem; letter-spacing: -1px; color: var(--primary); text-transform: uppercase; }

.nav-links a {
margin-left: 2rem;
text-decoration: none;
color: #ccc;
transition: color 0.3s ease;
font-size: 0.95rem;
}

.nav-links a:hover, .nav-cta-btn {
color: var(--primary);
}


#canvas-container {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: calc(100vh - 80px);
z-index: -1; /* Behind text but in background */
}
main { position: relative; margin-top: 4rem; padding-left: 5vw;}

.hero-text h2 {
font-size: clamp(1.5rem, 3vw, 2.5rem);
color: var(--secondary);
margin-bottom: 1rem}
