server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: OFF

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

greenops:
  spire:
    trust-domain: ${GREENOPS_SPIRE_TRUST_DOMAIN:greenops.internal}
    trust-anchor-pem: ${GREENOPS_SPIRE_X509_TRUST_ANCHOR_PEM:}
    jwt-rsa-public-key: ${GREENOPS_SPIRE_JWT_RSA_PUBLIC_KEY:}
    jwt-audience: ${GREENOPS_SPIRE_JWT_AUDIENCE:greenops-api}
    trusted-node-attestation-hashes: ${GREENOPS_SPIRE_TRUSTED_NODE_HASHES:}
    baseline:
      allowed-binaries: ${GREENOPS_SPIRE_ALLOWED_BINARIES:}
      user-profiles: ${GREENOPS_SPIRE_USER_PROCESS_PROFILES:}
  dry-run: ${GREENOPS_DRY_RUN:true}
  auth:
    cookie-secure: ${GREENOPS_AUTH_COOKIE_SECURE:false}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  aws:
    region: ${AWS_REGION:us-east-1}
  policy:
    idle-cpu-threshold: ${GREENOPS_POLICY_IDLE_CPU_THRESHOLD:2.0}
    idle-network-threshold-kbps: ${GREENOPS_POLICY_IDLE_NETWORK_THRESHOLD_KBPS:100.0}
    required-tag-key: ${GREENOPS_POLICY_REQUIRED_TAG_KEY:Environment}
    required-tag-value: ${GREENOPS_POLICY_REQUIRED_TAG_VALUE:dev}
    autostop-tag-key: ${GREENOPS_POLICY_AUTOSTOP_TAG_KEY:AutoStop}
    autostop-tag-value: ${GREENOPS_POLICY_AUTOSTOP_TAG_VALUE:true}
