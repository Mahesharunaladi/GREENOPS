server:
  port: 8080

logging:
  level:
    root: INFO
    '[org.springframework.web]': INFO
    '[org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor]': OFF

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./BACKEND/.env[.properties]"
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${GREENOPS_SMTP_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

greenops:
  spire:
    trust-domain: ${GREENOPS_SPIRE_TRUST_DOMAIN:greenops.internal}
    agent-socket: ${GREENOPS_SPIRE_AGENT_SOCKET:}
    trust-anchor-pem: ${GREENOPS_SPIRE_X509_TRUST_ANCHOR_PEM:}
    jwt-rsa-public-key: ${GREENOPS_SPIRE_JWT_RSA_PUBLIC_KEY:}
    jwt-audience: ${GREENOPS_SPIRE_JWT_AUDIENCE:greenops-api}
    trusted-node-attestation-hashes: ${GREENOPS_SPIRE_TRUSTED_NODE_HASHES:}
    baseline:
      allowed-binaries: ${GREENOPS_SPIRE_ALLOWED_BINARIES:}
      user-profiles: ${GREENOPS_SPIRE_USER_PROCESS_PROFILES:}
  deception:
    trusted-proxies: ${GREENOPS_DECEPTION_TRUSTED_PROXIES:}
  dry-run: ${GREENOPS_DRY_RUN:true}
  auth:
    cookie-secure: ${GREENOPS_AUTH_COOKIE_SECURE:false}
  enterprise:
    admin-api-key: ${GREENOPS_ENTERPRISE_ADMIN_API_KEY:}
    aws-account-id: ${GREENOPS_AWS_ACCOUNT_ID:}
    event-bus: ${GREENOPS_ENTERPRISE_EVENT_BUS:}
    canary-alert-webhook: ${GREENOPS_CANARY_ALERT_WEBHOOK:}
    canary-callback-url: ${GREENOPS_CANARY_CALLBACK_URL:}
    caep:
      webhook: ${GREENOPS_CAEP_WEBHOOK:}
      issuer: ${GREENOPS_CAEP_ISSUER:greenops}
      audience: ${GREENOPS_CAEP_AUDIENCE:greenops-idp}
      hmac-secret: ${GREENOPS_CAEP_HMAC_SECRET:}
    risk-exposure:
      s3-bucket: ${GREENOPS_RISK_EXPOSURE_S3_BUCKET:2500}
      rds-database: ${GREENOPS_RISK_EXPOSURE_RDS_DATABASE:15000}
      ec2-instance: ${GREENOPS_RISK_EXPOSURE_EC2_INSTANCE:5000}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  aws:
    region: ${AWS_REGION:us-east-1}
  policy:
    idle-cpu-threshold: ${GREENOPS_POLICY_IDLE_CPU_THRESHOLD:2.0}
    idle-network-threshold-kbps: ${GREENOPS_POLICY_IDLE_NETWORK_THRESHOLD_KBPS:100.0}
    required-tag-key: ${GREENOPS_POLICY_REQUIRED_TAG_KEY:Environment}
    required-tag-value: ${GREENOPS_POLICY_REQUIRED_TAG_VALUE:dev}
    autostop-tag-key: ${GREENOPS_POLICY_AUTOSTOP_TAG_KEY:AutoStop}
    autostop-tag-value: ${GREENOPS_POLICY_AUTOSTOP_TAG_VALUE:true}
  advanced:
    threat-table: ${GREENOPS_ADVANCED_THREAT_TABLE:}
    storyline-table: ${GREENOPS_ADVANCED_STORYLINE_TABLE:}
  notifications:
    sms-enabled: ${GREENOPS_SMS_ENABLED:false}
    operations-ingest-key: ${GREENOPS_OPERATIONS_INGEST_KEY:}
